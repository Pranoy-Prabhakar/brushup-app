kind = "web"
previewPath = "/"
title = "Brushup"
description = "A modular reference site for quickly refreshing software concepts through focused lessons, quick-reference tables, and skimmable refreshers."
version = "1.0.0"
id = "artifacts/python-brush-up"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18553

[services.development]
run = "pnpm --filter @workspace/brushup-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/brushup-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/python-brush-up/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18553"
BASE_PATH = "/"
