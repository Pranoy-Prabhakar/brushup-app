kind = "web"
previewPath = "/"
title = "Brushup"
description = "A compact, searchable topic refresher with clear lessons, quick-reference tables, and a skimmable cheat sheet. Starts with Python and is structured to grow with more subjects."
version = "1.0.0"
id = "artifacts/python-brush-up"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18553

[services.development]
run = "pnpm --filter @workspace/python-brush-up run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/python-brush-up", "run", "build" ]
serve = "static"
publicDir = "artifacts/python-brush-up/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18553"
BASE_PATH = "/"
